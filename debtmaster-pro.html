  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #111118;
      --bg3: #18181f;
      --bg4: #1f1f2a;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f0f0f5;
      --text2: #9090a8;
      --text3: #5a5a70;
      --indigo: #6c63ff;
      --indigo2: #4f46e5;
      --indigo-dim: rgba(108,99,255,0.15);
      --indigo-dim2: rgba(108,99,255,0.08);
      --rose: #ff4d6d;
      --rose-dim: rgba(255,77,109,0.15);
      --emerald: #00d97e;
      --emerald-dim: rgba(0,217,126,0.12);
      --amber: #ffc542;
      --amber-dim: rgba(255,197,66,0.12);
      --radius: 18px;
      --radius-lg: 24px;
      --radius-xl: 32px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"] { -moz-appearance: textfield; }

    /* Animated gradient header bg */
    .header-glow {
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 120px;
      background: radial-gradient(ellipse, rgba(108,99,255,0.25) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(20px);
    }

    /* Cards */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border2); }
    .card-glass {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    /* Stat cards */
    .stat-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: var(--border2); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px;
      border-radius: 12px;
      font-family: 'Sarabun', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }
    .btn-primary {
      background: var(--indigo);
      color: #fff;
    }
    .btn-primary:hover { background: #7c73ff; transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-ghost {
      background: var(--bg4);
      color: var(--text2);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { background: var(--bg3); color: var(--text); }
    .btn-danger {
      background: var(--rose-dim);
      color: var(--rose);
      border: 1px solid rgba(255,77,109,0.2);
    }
    .btn-danger:hover { background: rgba(255,77,109,0.25); }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 10px; }
    .btn-icon {
      padding: 8px; border-radius: 10px;
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--text3);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-icon:hover { color: var(--rose); border-color: var(--rose-dim); background: var(--rose-dim); }

    /* Inputs */
    .input-field {
      background: var(--bg4);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      outline: none;
      transition: all 0.15s;
    }
    .input-field:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px var(--indigo-dim); }
    .input-field::placeholder { color: var(--text3); font-weight: 400; }

    /* Labels */
    .label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 5px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text3);
      font-family: 'Sarabun', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .tab-btn.active {
      background: var(--indigo);
      color: #fff;
      box-shadow: 0 4px 16px rgba(108,99,255,0.35);
    }
    .tab-btn:not(.active):hover { background: var(--bg4); color: var(--text2); }

    /* Risk meter */
    .risk-bar {
      height: 6px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--emerald) 0%, var(--amber) 50%, var(--rose) 100%);
      position: relative;
      overflow: visible;

    .risk-needle {
      position: absolute;
      top: 50%;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;

      transform: translate(-50%, -50%);

    .progress-ring { transform: rotate(-90deg); }

      border-radius: var(--radius);
      padding: 16px 20px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;

      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--indigo);
      border-radius: 3px 0 0 3px;

      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg3);

    .strategy-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .strategy-card.active-strat { border-color: var(--indigo); background: var(--indigo-dim2); box-shadow: 0 8px 32px rgba(108,99,255,0.2); }
    .strategy-card.survival-active { border-color: var(--rose); background: var(--rose-dim); }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;

    .badge-indigo { background: var(--indigo-dim); color: var(--indigo); }
    .badge-rose { background: var(--rose-dim); color: var(--rose); }
    .badge-emerald { background: var(--emerald-dim); color: var(--emerald); }
    .badge-amber { background: var(--amber-dim); color: var(--amber); }

    /* Chart container */
    .chart-wrap { position: relative; width: 100%; }

    /* Divider */
    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* Scrollable debt list */
    .debt-list { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding-right: 4px; }

    /* Tooltip */
    .tooltip-wrap { position: relative; display: inline-flex; }
    .tooltip-box {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg4);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      white-space: nowrap;
      color: var(--text2);
      pointer-events: none;
      display: none;
    }
    .tooltip-wrap:hover .tooltip-box { display: block; }

    /* Shine animation on key metric */
    @keyframes shine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .text-shine {
      background: linear-gradient(90deg, var(--indigo) 0%, #a78bfa 40%, var(--indigo) 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shine 3s linear infinite;
    }

    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    .fade-up { animation: fadeUp 0.35s ease forwards; }

    @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.6; transform:scale(0.85); } }
    .pulse-dot { animation: pulse-dot 2s ease infinite; }

    /* Mono numbers */
    .mono { font-family: 'Space Mono', monospace; }

    /* Grid helpers */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
    @media(max-width:900px) {
      .grid-5 { grid-template-columns: repeat(3,1fr); }
      .grid-3 { grid-template-columns: 1fr; }
      .lg-grid-3 { grid-template-columns: 1fr !important; }
    }
    @media(max-width:600px) {
      .grid-2 { grid-template-columns: 1fr; }
      .grid-5 { grid-template-columns: 1fr 1fr; }
      .hide-mobile { display: none !important; }
    }

    /* Scrollbar for debt list */
    .debt-list::-webkit-scrollbar { width: 3px; }
    .debt-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* Range slider */
    input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 5px; background: var(--bg4); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--indigo); cursor: pointer; box-shadow: 0 0 0 3px var(--indigo-dim); }
    input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--indigo); cursor: pointer; border: none; }

    /* Canvase */
    canvas { display: block; }

    /* Glow text */
    .glow { text-shadow: 0 0 20px rgba(108,99,255,0.6); }
  </style>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ─── Icons (inline SVG) ─────────────────────────────────────────
const icons = {

  alert: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
  check: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>,

  trophy: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2"/><path d="M18 9h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>,

// ─── Utilities ────────────────────────────────────────────────────
const fmt = (n, d = 0) => {
  if (isNaN(n) || n === null) return '0';
  return Math.round(n).toLocaleString('th-TH');
};
const fmtDec = (n, d = 1) => Number(n).toFixed(d);

// ─── Payoff engine ────────────────────────────────────────────────
function calcPayoff(debts, strategyType, monthlyExtra) {
  if (!debts.length) return { months: 0, totalInterest: 0, totalPaid: 0, timeline: [], debtTimelines: [] };
  let ds = debts.map(d => ({
    ...d,
    bal: Math.max(0, Number(d.balance) || 0),
    rate: (Number(d.interestRate) || 0) / 100 / 12,
    min: Number(d.minPayment) || 0,
  }));

  if (strategyType === 'snowball') ds.sort((a, b) => a.bal - b.bal);
  else if (strategyType === 'avalanche') ds.sort((a, b) => b.rate - a.rate);

  let months = 0, totalInterest = 0, totalPaid = 0, timeline = [], debtTimelines = ds.map(d => [d.bal]);
  const MAX = 600;

  while (ds.some(d => d.bal > 0.01) && months < MAX) {
    months++;
    let extra = strategyType === 'survival' ? 0 : Number(monthlyExtra) || 0;

    ds.forEach(d => {
      if (d.bal <= 0.01) return;
      const interest = d.bal * d.rate;
      totalInterest += interest;
      d.bal += interest;
      const pay = Math.min(d.bal, d.min);
      d.bal -= pay;
      totalPaid += pay;
      d.bal = Math.max(0, d.bal);
    });

    for (let d of ds) {
      if (d.bal > 0.01 && extra > 0.01) {
        const applied = Math.min(d.bal, extra);
        d.bal -= applied;
        totalPaid += applied;
        extra -= applied;
      }
    }

    const totalBal = ds.reduce((s, d) => s + Math.max(0, d.bal), 0);
    timeline.push({ month: months, balance: totalBal });
    ds.forEach((d, i) => { debtTimelines[i]?.push(Math.max(0, d.bal)); });
    if (totalBal < 0.01) break;
  }
  return { months, totalInterest, totalPaid, timeline, debtTimelines };
}

// ─── AI Coach messages ────────────────────────────────────────────
function getCoachMsg(cashFlow, dti, totalDebt, monthlyInterest, months, interestSaved) {
  if (totalDebt === 0) return 'เพิ่มรายการหนี้เพื่อให้ AI วิเคราะห์แผนปลดหนี้ที่เหมาะสมให้คุณครับ';
  if (cashFlow < 0) return `รายจ่ายรวมสูงกว่ารายได้ ${fmt(Math.abs(cashFlow))} บาท ควรเจรจาขอยืดหนี้หรือลดค่างวดก่อนครับ`;
  if (dti > 50) return `DTI สูงถึง ${fmtDec(dti)}% อยู่ในโซนวิกฤต แนะนำใช้ Survival Mode และเร่งหารายได้เสริมครับ`;
  if (monthlyInterest > cashFlow * 0.8) return `ดอกเบี้ยเดือนละ ${fmt(monthlyInterest)} บาทกินเกือบ 80% ของเงินคงเหลือ แนะนำ Avalanche เพื่อหยุดเลือดไวที่สุดครับ`;
  if (months <= 24) return `เยี่ยม! แผนนี้จะพาคุณหลุดหนี้ทั้งหมดใน ${months} เดือน ถ้าโปะเพิ่มอีกนิดจะยิ่งเร็วกว่านี้ครับ`;
  return `โปะเงินเพิ่มทุกเดือนจะช่วยประหยัดดอกเบี้ยได้ถึง ${fmt(interestSaved)} บาท และหลุดหนี้เร็วขึ้นหลายปีครับ`;
}

// ─── Small components ─────────────────────────────────────────────
const StatCard = ({ label, value, sub, color = 'var(--text)', accent }) => (
  <div className="stat-card" style={accent ? { borderColor: accent, background: `${accent}10` } : {}}>
    <div className="label">{label}</div>
    <div className="mono" style={{ fontSize: 20, fontWeight: 700, color, marginTop: 4 }}>{value}</div>
    {sub && <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 4 }}>{sub}</div>}
  </div>
);

const Badge = ({ children, type = 'indigo' }) => (
  <span className={`badge badge-${type}`}>{children}</span>
);

// ─── Main App ─────────────────────────────────────────────────────
const App = () => {
  const [tab, setTab] = useState('dashboard');
  const [debts, setDebts] = useState([]);
  const [income, setIncome] = useState('');
  const [essential, setEssential] = useState('');
  const [extra, setExtra] = useState(0);
  const [strategy, setStrategy] = useState('avalanche');
  const [editingId, setEditingId] = useState(null);
  const chartRef = useRef(null);
  const chartInst = useRef(null);
  const [copied, setCopied] = useState(false);

  // Persist
  useEffect(() => {
    try {
      const d = localStorage.getItem('dm_debts_v3'); if (d) setDebts(JSON.parse(d));
      const f = localStorage.getItem('dm_fin_v3'); if (f) { const p = JSON.parse(f); setIncome(p.i||''); setEssential(p.e||''); setExtra(p.x||0); }
      const s = localStorage.getItem('dm_strat_v3'); if (s) setStrategy(s);
    } catch {}
  }, []);
  useEffect(() => { try { localStorage.setItem('dm_debts_v3', JSON.stringify(debts)); } catch {} }, [debts]);
  useEffect(() => { try { localStorage.setItem('dm_fin_v3', JSON.stringify({i:income,e:essential,x:extra})); } catch {} }, [income,essential,extra]);
  useEffect(() => { try { localStorage.setItem('dm_strat_v3', strategy); } catch {} }, [strategy]);

  // Calculations
  const numIncome = Number(income) || 0;
  const numEssential = Number(essential) || 0;
  const totalDebt = useMemo(() => debts.reduce((s,d) => s + (Number(d.balance)||0), 0), [debts]);
  const totalMin = useMemo(() => debts.reduce((s,d) => s + (Number(d.minPayment)||0), 0), [debts]);
  const monthlyInterest = useMemo(() => debts.reduce((s,d) => s + ((Number(d.balance)||0)*(Number(d.interestRate)||0)/100/12), 0), [debts]);
  const cashFlow = numIncome - numEssential - totalMin;
  const dti = numIncome > 0 ? (totalMin / numIncome * 100) : 0;

  const riskLevel = useMemo(() => {
    if (dti === 0) return { label: 'ยังไม่มีข้อมูล', color: 'var(--text3)', badge: 'indigo' };
    if (dti <= 30) return { label: 'ปลอดภัย', color: 'var(--emerald)', badge: 'emerald' };
    if (dti <= 45) return { label: 'เฝ้าระวัง', color: 'var(--amber)', badge: 'amber' };
    return { label: 'วิกฤต', color: 'var(--rose)', badge: 'rose' };
  }, [dti]);

  const currentPayoff = useMemo(() => calcPayoff(debts, strategy, extra), [debts, strategy, extra]);
  const basePayoff = useMemo(() => calcPayoff(debts, 'survival', 0), [debts]);
  const extraPayoff = useMemo(() => calcPayoff(debts, strategy, cashFlow > 0 ? cashFlow : 0), [debts, strategy, cashFlow]);
  const interestSaved = Math.max(0, basePayoff.totalInterest - currentPayoff.totalInterest);
  const monthsSaved = Math.max(0, basePayoff.months - currentPayoff.months);

  // Payoff date
  const payoffDate = useMemo(() => {
    if (!currentPayoff.months) return null;
    const d = new Date();
    d.setMonth(d.getMonth() + currentPayoff.months);
    return d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
  }, [currentPayoff.months]);

  // Coach message
  const coachMsg = useMemo(() => getCoachMsg(cashFlow, dti, totalDebt, monthlyInterest, currentPayoff.months, interestSaved), [cashFlow, dti, totalDebt, monthlyInterest, currentPayoff.months, interestSaved]);

  // Chart
  useEffect(() => {
    if (tab !== 'strategy' && tab !== 'sim') return;
    const canvas = document.getElementById('payoffChart');
    if (!canvas) return;
    if (chartInst.current) { chartInst.current.destroy(); chartInst.current = null; }
    if (!currentPayoff.timeline.length) return;

    // Compare 3 strategies for sim tab
    const showCompare = tab === 'sim';
    const ava = showCompare ? calcPayoff(debts, 'avalanche', extra) : null;
    const snow = showCompare ? calcPayoff(debts, 'snowball', extra) : null;
    const surv = showCompare ? calcPayoff(debts, 'survival', 0) : null;
    const maxLen = showCompare ? Math.max(ava.timeline.length, snow.timeline.length, surv.timeline.length) : currentPayoff.timeline.length;

    const labels = Array.from({length: maxLen}, (_, i) => i % 6 === 0 ? `เดือน ${i+1}` : '');

    const getVals = (tl) => {
      const vals = tl.map(t => Math.round(t.balance));
      while (vals.length < maxLen) vals.push(0);
      return vals;
    };

    const datasets = showCompare ? [
      { label: 'Avalanche', data: getVals(ava.timeline), borderColor: '#6c63ff', backgroundColor: 'rgba(108,99,255,0.08)', tension: 0.4, fill: true, pointRadius: 0 },
      { label: 'Snowball', data: getVals(snow.timeline), borderColor: '#00d97e', backgroundColor: 'rgba(0,217,126,0.05)', tension: 0.4, fill: false, pointRadius: 0, borderDash: [4,4] },
      { label: 'Minimum Only', data: getVals(surv.timeline), borderColor: '#ff4d6d', backgroundColor: 'rgba(255,77,109,0.05)', tension: 0.4, fill: false, pointRadius: 0, borderDash: [2,4] },
    ] : [
      { label: 'ยอดหนี้คงเหลือ', data: getVals(currentPayoff.timeline), borderColor: '#6c63ff', backgroundColor: 'rgba(108,99,255,0.08)', tension: 0.4, fill: true, pointRadius: 0, borderWidth: 2 },
    ];

    chartInst.current = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: showCompare, labels: { color: '#9090a8', font: { size: 11 }, usePointStyle: true, pointStyleWidth: 8 } },
          tooltip: {
            backgroundColor: '#18181f',
            borderColor: 'rgba(255,255,255,0.1)',
            borderWidth: 1,
            titleColor: '#9090a8',
            bodyColor: '#f0f0f5',
            callbacks: { label: ctx => ` ฿${Math.round(ctx.parsed.y).toLocaleString('th-TH')}` }
          }
        },
        scales: {
          x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5a5a70', font: { size: 10 } } },
          y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#5a5a70', font: { size: 10 }, callback: v => '฿' + Math.round(v/1000) + 'K' }, beginAtZero: true }
        }
      }
    });
  }, [tab, currentPayoff, debts, extra, strategy]);

  // Debt CRUD
  const addDebt = () => {
    const id = Date.now();
    setDebts(prev => [...prev, { id, name: 'หนี้ใหม่', balance: '', interestRate: '', minPayment: '' }]);
    setEditingId(id);
  };
  const updateDebt = (id, field, val) => {
    setDebts(prev => prev.map(d => d.id === id ? { ...d, [field]: val } : d));
  };
  const removeDebt = (id) => setDebts(prev => prev.filter(d => d.id !== id));

  // Tabs config
  const tabs = [
    { id: 'dashboard', label: 'ภาพรวม', icon: icons.dashboard },
    { id: 'debts', label: 'หนี้ของฉัน', icon: icons.wallet },
    { id: 'strategy', label: 'กลยุทธ์', icon: icons.zap },
    { id: 'sim', label: 'จำลอง', icon: icons.chart },
  ];

  return (
    <div style={{ maxWidth: 960, margin: '0 auto', padding: '0 16px 120px' }}>

      {/* HEADER */}
      <header style={{ padding: '28px 0 24px', position: 'relative' }}>
        <div className="header-glow" />
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'relative', zIndex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <div style={{ width: 44, height: 44, borderRadius: 14, background: 'var(--indigo)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(108,99,255,0.4)' }}>
              {icons.fire}
            </div>
            <div>
              <div style={{ fontSize: 20, fontWeight: 800, letterSpacing: '-0.02em' }}>
                <span className="text-shine">DebtMaster</span>
                <span style={{ color: 'var(--text2)', fontWeight: 400, fontSize: 14 }}> Pro</span>
              </div>
              <div style={{ fontSize: 10, color: 'var(--text3)', fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', marginTop: 1 }}>AI-Powered Debt Elimination</div>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            {totalDebt > 0 && (
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 10, color: 'var(--text3)', fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase' }}>หนี้รวม</div>
                <div className="mono" style={{ fontSize: 16, fontWeight: 700, color: 'var(--rose)' }}>฿{fmt(totalDebt)}</div>
              </div>
            )}
          </div>
        </div>
      </header>

      {/* TAB BAR */}
      <div className="tab-bar" style={{ marginBottom: 24 }}>
        {tabs.map(t => (
          <button key={t.id} className={`tab-btn ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
            {t.icon}
            <span style={{ fontSize: 9 }}>{t.label}</span>
          </button>
        ))}
      </div>

      {/* ── DASHBOARD ─────────────────────────────────── */}
      {tab === 'dashboard' && (
        <div className="fade-up">
          {/* 5 Key Metrics */}
          <div className="grid-5" style={{ marginBottom: 16 }}>
            <StatCard label="หนี้รวมทั้งหมด" value={`฿${fmt(totalDebt)}`} color="var(--text)" />
            <StatCard label="ดอกเบี้ย/เดือน" value={`฿${fmt(monthlyInterest)}`} color="var(--rose)" accent="var(--rose)" />
            <StatCard label="เงินคงเหลือ/เดือน" value={`฿${fmt(cashFlow)}`} color={cashFlow >= 0 ? 'var(--emerald)' : 'var(--rose)'} accent={cashFlow >= 0 ? 'var(--emerald)' : 'var(--rose)'} />
            <StatCard label="DTI Ratio" value={`${fmtDec(dti)}%`} sub={riskLevel.label} color={riskLevel.color} accent={riskLevel.color} />
            <StatCard label="เดือนที่ปลดหนี้" value={currentPayoff.months ? `${currentPayoff.months} เดือน` : '—'} sub={payoffDate} color="var(--indigo)" accent="var(--indigo)" />
          </div>

          {/* Main grid */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.7fr', gap: 14 }} className="lg-grid-3">
            {/* Left col */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              {/* Risk meter */}
              <div className="card" style={{ padding: 24 }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18 }}>
                  <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)' }}>Risk Meter</div>
                  <Badge type={riskLevel.badge}>{riskLevel.label}</Badge>
                </div>
                <div className="risk-bar" style={{ marginBottom: 24 }}>
                  <div className="risk-needle" style={{ left: `${Math.min(100, dti * 2)}%` }} />
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginTop: -16, marginBottom: 16 }}>
                  <span>ต่ำ &lt;30%</span><span>กลาง 45%</span><span>สูง 50%+</span>
                </div>
                <div style={{ background: 'var(--bg4)', borderRadius: 12, padding: '12px 14px' }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text2)', lineHeight: 1.6 }}>
                    DTI ของคุณอยู่ที่ <span style={{ color: riskLevel.color, fontWeight: 800 }}>{fmtDec(dti)}%</span><br/>
                    {dti <= 30 ? 'ภาระหนี้ต่อรายได้อยู่ในเกณฑ์ดีเยี่ยม' : dti <= 45 ? 'เริ่มมีภาระหนี้สูง ควรระวัง' : 'ภาระหนี้สูงมาก ควรแก้ไขด่วน'}
                  </div>
                </div>
              </div>

              {/* AI Coach */}
              <div style={{ background: 'linear-gradient(135deg, #1a1230 0%, #0f1a1f 100%)', border: '1px solid rgba(108,99,255,0.2)', borderRadius: 'var(--radius-lg)', padding: 24, flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--emerald)' }} className="pulse-dot" />
                  <div style={{ fontSize: 9, fontWeight: 800, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--indigo)' }}>AI Debt Coach</div>
                </div>
                <div style={{ fontSize: 14, fontWeight: 500, lineHeight: 1.7, color: 'var(--text2)', fontStyle: 'italic' }}>
                  "{coachMsg}"
                </div>
                {interestSaved > 0 && (
                  <div style={{ marginTop: 14, padding: '10px 14px', background: 'rgba(0,217,126,0.08)', borderRadius: 12, border: '1px solid rgba(0,217,126,0.15)' }}>
                    <div style={{ fontSize: 10, color: 'var(--emerald)', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.08em' }}>ประหยัดดอกเบี้ยได้</div>
                    <div className="mono" style={{ fontSize: 18, fontWeight: 700, color: 'var(--emerald)', marginTop: 2 }}>฿{fmt(interestSaved)}</div>
                  </div>
                )}
              </div>
            </div>

            {/* Right col */}
            <div className="card" style={{ padding: 28 }}>
              <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginBottom: 20 }}>Monthly Cashflow</div>

              {/* Cashflow bars */}
              {[
                { label: 'รายได้สุทธิ', value: numIncome, color: 'var(--indigo)', neg: false },
                { label: 'ค่าใช้จ่ายจำเป็น', value: numEssential, color: 'var(--rose)', neg: true },
                { label: 'ชำระหนี้ขั้นต่ำ', value: totalMin, color: 'var(--amber)', neg: true },
              ].map((row, i) => {
                const pct = numIncome > 0 ? Math.min(100, row.value / numIncome * 100) : 0;
                return (
                  <div key={i} style={{ marginBottom: 16 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)' }}>{row.label}</div>
                      <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: row.neg ? 'var(--rose)' : 'var(--text)' }}>
                        {row.neg ? '−' : '+'}฿{fmt(row.value)}
                      </div>
                    </div>
                    <div style={{ height: 6, background: 'var(--bg4)', borderRadius: 6, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${pct}%`, background: row.color, borderRadius: 6, opacity: 0.7, transition: 'width 0.6s ease' }} />
                    </div>
                  </div>
                );
              })}

              <div className="divider" />

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px 18px', background: cashFlow >= 0 ? 'rgba(108,99,255,0.08)' : 'var(--rose-dim)', borderRadius: 14, border: `1px solid ${cashFlow >= 0 ? 'rgba(108,99,255,0.2)' : 'rgba(255,77,109,0.2)'}` }}>
                <div>
                  <div style={{ fontSize: 10, fontWeight: 800, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>เงินสำหรับโปะหนี้เพิ่ม</div>
                  <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>หลังหักค่าใช้จ่ายและขั้นต่ำ</div>
                </div>
                <div className="mono" style={{ fontSize: 24, fontWeight: 700, color: cashFlow >= 0 ? 'var(--indigo)' : 'var(--rose)' }}>฿{fmt(cashFlow)}</div>
              </div>

              {debts.length > 0 && (
                <>
                  <div className="divider" />
                  <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginBottom: 12 }}>สัดส่วนหนี้แต่ละรายการ</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {debts.map(d => {
                      const pct = totalDebt > 0 ? (Number(d.balance)||0) / totalDebt * 100 : 0;
                      return (
                        <div key={d.id} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <div style={{ fontSize: 12, color: 'var(--text2)', minWidth: 90, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{d.name}</div>
                          <div style={{ flex: 1, height: 5, background: 'var(--bg4)', borderRadius: 5, overflow: 'hidden' }}>
                            <div style={{ height: '100%', width: `${pct}%`, background: 'var(--indigo)', borderRadius: 5, opacity: 0.7 }} />
                          </div>
                          <div className="mono" style={{ fontSize: 11, color: 'var(--text3)', minWidth: 40, textAlign: 'right' }}>{fmtDec(pct)}%</div>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}

              {debts.length === 0 && (
                <div style={{ marginTop: 24, textAlign: 'center', padding: '32px 0' }}>

                  <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={() => setTab('debts')}>
                    {icons.plus} เพิ่มรายการหนี้แรก
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* Milestones (if data exists) */}
          {currentPayoff.months > 0 && (
            <div className="card" style={{ padding: 24, marginTop: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginBottom: 18 }}>🏆 Debt Freedom Milestones</div>
              <div className="grid-3">
                {[
                  { label: '25% สำเร็จ', months: Math.round(currentPayoff.months * 0.25), color: 'var(--indigo)' },
                  { label: '50% สำเร็จ', months: Math.round(currentPayoff.months * 0.5), color: 'var(--amber)' },
                  { label: 'ปลดหนี้ทั้งหมด', months: currentPayoff.months, color: 'var(--emerald)' },
                ].map((m, i) => {

              </div>
            </div>
            {numIncome > 0 && (
              <div style={{ marginTop: 14, padding: '10px 14px', background: cashFlow >= 0 ? 'var(--indigo-dim2)' : 'var(--rose-dim)', borderRadius: 12, border: `1px solid ${cashFlow >= 0 ? 'var(--indigo-dim)' : 'rgba(255,77,109,0.2)'}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontSize: 12, color: 'var(--text2)', fontWeight: 600 }}>เงินคงเหลือหลังหักทุกอย่าง</span>
                <span className="mono" style={{ fontSize: 16, fontWeight: 700, color: cashFlow >= 0 ? 'var(--indigo)' : 'var(--rose)' }}>฿{fmt(cashFlow)}</span>
              </div>
            )}
          </div>

          {/* Debt list */}
          <div className="card" style={{ padding: 24 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)' }}>รายการหนี้ทั้งหมด</div>
                <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{debts.length} รายการ · รวม ฿{fmt(totalDebt)}</div>
              </div>
              <button className="btn btn-primary" onClick={addDebt}>{icons.plus} เพิ่มหนี้</button>
            </div>

            {debts.length === 0 && (
              <div style={{ textAlign: 'center', padding: '48px 0', color: 'var(--text3)' }}>
                <div style={{ fontSize: 40, marginBottom: 12 }}>💳</div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>ยังไม่มีรายการหนี้</div>
                <div style={{ fontSize: 12, marginTop: 4 }}>กดปุ่มเพิ่มหนี้เพื่อเริ่มต้น</div>
              </div>
            )}

            <div className="debt-list">
              {debts.map((d, i) => (
                <div key={d.id} className="debt-row" style={{ '--accent': d.interestRate > 20 ? 'var(--rose)' : d.interestRate > 10 ? 'var(--amber)' : 'var(--indigo)' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr auto', gap: 12, alignItems: 'end' }}>
                    <div>
                      <label className="label">ชื่อหนี้</label>
                      <input className="input-field" value={d.name} onChange={e => updateDebt(d.id, 'name', e.target.value)} placeholder="เช่น บัตรเครดิต" style={{ padding: '8px 12px', fontSize: 13 }} />
                    </div>
                    <div>
                      <label className="label">ยอดคงเหลือ (฿)</label>
                      <input className="input-field" type="number" value={d.balance} onChange={e => updateDebt(d.id, 'balance', e.target.value)} placeholder="0" style={{ padding: '8px 12px', fontSize: 13 }} />
                    </div>
                    <div>
                      <label className="label">ดอกเบี้ย (%/ปี)</label>
                      <input className="input-field" type="number" value={d.interestRate} onChange={e => updateDebt(d.id, 'interestRate', e.target.value)} placeholder="0.00" style={{ padding: '8px 12px', fontSize: 13, color: Number(d.interestRate) > 15 ? 'var(--rose)' : 'var(--text)' }} />
                    </div>
                    <div>
                      <label className="label">ขั้นต่ำ/เดือน (฿)</label>
                      <input className="input-field" type="number" value={d.minPayment} onChange={e => updateDebt(d.id, 'minPayment', e.target.value)} placeholder="0" style={{ padding: '8px 12px', fontSize: 13 }} />
                    </div>
                    <button className="btn-icon" onClick={() => removeDebt(d.id)} title="ลบ">{icons.trash}</button>
                  </div>
                  {/* Mini stats */}
                  {d.balance && d.interestRate && (
                    <div style={{ marginTop: 10, display: 'flex', gap: 12 }}>
                      <div style={{ fontSize: 11, color: 'var(--text3)' }}>
                        ดอกเบี้ย/เดือน: <span style={{ color: 'var(--rose)', fontWeight: 700 }}>฿{fmt((Number(d.balance)||0)*(Number(d.interestRate)||0)/100/12)}</span>
                      </div>
                      {d.minPayment && (
                        <div style={{ fontSize: 11, color: 'var(--text3)' }}>
                          % ขั้นต่ำต่อยอด: <span style={{ color: 'var(--amber)', fontWeight: 700 }}>{fmtDec((Number(d.minPayment)||0)/(Number(d.balance)||1)*100)}%</span>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {debts.length > 0 && (
              <div style={{ marginTop: 16, padding: '14px 18px', background: 'var(--bg3)', borderRadius: 14, display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10 }}>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>ยอดชำระขั้นต่ำรวม: <span className="mono" style={{ color: 'var(--text)', fontWeight: 700 }}>฿{fmt(totalMin)}</span></div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>ดอกเบี้ยรวม/เดือน: <span className="mono" style={{ color: 'var(--rose)', fontWeight: 700 }}>฿{fmt(monthlyInterest)}</span></div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>จำนวนหนี้: <span style={{ color: 'var(--text)', fontWeight: 700 }}>{debts.length} รายการ</span></div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── STRATEGY ──────────────────────────────────── */}
      {tab === 'strategy' && (
        <div className="fade-up">
          {/* Strategy picker */}
          <div className="grid-3" style={{ marginBottom: 14 }}>
            {[
              { id: 'avalanche', label: 'Avalanche', icon: icons.fire, desc: 'โปะหนี้ดอกแพงสุดก่อน ประหยัดดอกเบี้ยมากที่สุดในระยะยาว', sub: 'แนะนำสำหรับคนมีวินัยสูง', color: 'var(--indigo)' },
              { id: 'snowball', label: 'Snowball', icon: icons.snowflake, desc: 'โปะหนี้ก้อนเล็กสุดก่อน สร้างแรงใจและชัยชนะทีละก้าว', sub: 'แนะนำสำหรับคนต้องการกำลังใจ', color: 'var(--emerald)' },
              { id: 'survival', label: 'Survival', icon: icons.shield, desc: 'จ่ายแค่ขั้นต่ำทุกรายการ รักษากระแสเงินสดในยามฉุกเฉิน', sub: 'สำหรับสถานการณ์วิกฤต', color: 'var(--rose)' },
            ].map(s => (
              <button key={s.id}
                className={`strategy-card ${strategy === s.id ? (s.id === 'survival' ? 'survival-active' : 'active-strat') : ''}`}
                onClick={() => setStrategy(s.id)}
                style={{ textAlign: 'left', width: '100%' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
                  <div style={{ width: 36, height: 36, borderRadius: 10, background: strategy === s.id ? s.color : 'var(--bg4)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: strategy === s.id ? '#fff' : 'var(--text3)', transition: 'all 0.2s' }}>
                    {s.icon}
                  </div>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.04em', color: strategy === s.id ? s.color : 'var(--text)' }}>{s.label}</div>
                    {strategy === s.id && <div style={{ fontSize: 9, color: s.color, fontWeight: 700 }}>● ใช้งานอยู่</div>}
                  </div>
                </div>
                <div style={{ fontSize: 12, color: 'var(--text2)', lineHeight: 1.6, marginBottom: 8 }}>{s.desc}</div>
                <div style={{ fontSize: 10, color: 'var(--text3)', fontStyle: 'italic' }}>{s.sub}</div>
              </button>
            ))}
          </div>

          {/* Extra payment slider */}
          <div className="card" style={{ padding: 24, marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)' }}>เงินโปะเพิ่มต่อเดือน</div>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>นอกเหนือจากขั้นต่ำ</div>
              </div>
              <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: 'var(--indigo)' }}>฿{fmt(extra)}</div>
            </div>
            <input type="range" min="0" max={Math.max(cashFlow, 5000, numIncome * 0.5)} step="500" value={extra}
              onChange={e => setExtra(Number(e.target.value))} style={{ marginBottom: 8 }} />
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text3)', fontWeight: 700 }}>
              <span>฿0</span>
              <span>฿{fmt(Math.max(cashFlow, 5000, numIncome * 0.5))}</span>
            </div>
          </div>

          {/* Result panel */}
          <div style={{ background: 'linear-gradient(135deg, #10101a 0%, #141830 100%)', border: '1px solid rgba(108,99,255,0.25)', borderRadius: 'var(--radius-xl)', padding: 28 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 24 }} className="lg-grid-3">
              <div>
                <div style={{ fontSize: 10, color: 'var(--indigo)', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: 6 }}>ระยะเวลาปลดหนี้</div>
                <div className="mono glow" style={{ fontSize: 36, fontWeight: 700, color: 'var(--text)' }}>{currentPayoff.months || '—'}</div>
                <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>เดือน {payoffDate ? `· ${payoffDate}` : ''}</div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, alignContent: 'start' }}>
                {[
                  { label: 'ดอกเบี้ยรวม', value: `฿${fmt(currentPayoff.totalInterest)}`, color: 'var(--rose)' },
                  { label: 'ประหยัดได้', value: `฿${fmt(interestSaved)}`, color: 'var(--emerald)' },
                  { label: 'เร็วขึ้น', value: `${monthsSaved} เดือน`, color: 'var(--amber)' },
                  { label: 'จ่ายรวม', value: `฿${fmt(currentPayoff.totalPaid)}`, color: 'var(--text2)' },
                ].map((item, i) => (
                  <div key={i} style={{ background: 'rgba(255,255,255,0.04)', borderRadius: 12, padding: '12px 14px', border: '1px solid rgba(255,255,255,0.06)' }}>
                    <div style={{ fontSize: 9, color: 'var(--text3)', fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 4 }}>{item.label}</div>
                    <div className="mono" style={{ fontSize: 14, fontWeight: 700, color: item.color }}>{item.value}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Chart */}
            <div style={{ height: 180 }} className="chart-wrap">
              <canvas id="payoffChart" />
            </div>
          </div>

          {/* Debt priority order */}
          {debts.length > 0 && (
            <div className="card" style={{ padding: 24, marginTop: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginBottom: 16 }}>ลำดับการโปะหนี้ตามแผน {strategy === 'avalanche' ? 'Avalanche' : strategy === 'snowball' ? 'Snowball' : 'Survival'}</div>
              {[...debts]
                .sort((a, b) => {
                  if (strategy === 'avalanche') return (Number(b.interestRate)||0) - (Number(a.interestRate)||0);
                  if (strategy === 'snowball') return (Number(a.balance)||0) - (Number(b.balance)||0);
                  return 0;
                })
                .map((d, i) => (
                  <div key={d.id} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '12px 0', borderBottom: i < debts.length-1 ? '1px solid var(--border)' : 'none' }}>
                    <div style={{ width: 28, height: 28, borderRadius: '50%', background: i === 0 ? 'var(--indigo)' : 'var(--bg4)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 800, color: i === 0 ? '#fff' : 'var(--text3)', flexShrink: 0 }}>
                      {i + 1}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--text)' }}>{d.name || 'ไม่มีชื่อ'}</div>
                      <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>
                        ฿{fmt(Number(d.balance)||0)} · {d.interestRate || 0}%/ปี
                      </div>
                    </div>
                    {i === 0 && <Badge type="indigo">โปะก่อน</Badge>}
                  </div>
                ))
              }
            </div>
          )}
        </div>
      )}

      {/* ── SIMULATION ────────────────────────────────── */}
      {tab === 'sim' && (
        <div className="fade-up">
          {/* Extra payment control */}
          <div className="card" style={{ padding: 24, marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)' }}>จำลอง: โปะเพิ่มเดือนละ</div>
              <div className="mono" style={{ fontSize: 22, fontWeight: 700, color: 'var(--indigo)' }}>฿{fmt(extra)}</div>
            </div>
            <input type="range" min="0" max={Math.max(cashFlow, 5000, numIncome * 0.5)} step="500" value={extra} onChange={e => setExtra(Number(e.target.value))} />
          </div>

          {/* Comparison chart */}
          <div className="card" style={{ padding: 24, marginBottom: 14 }}>
            <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginBottom: 6 }}>เปรียบเทียบ 3 กลยุทธ์</div>
            <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 16 }}>กราฟยอดหนี้คงเหลือตามเวลา</div>
            <div style={{ height: 260 }} className="chart-wrap">
              <canvas id="payoffChart" />
            </div>
          </div>

          {/* Strategy comparison table */}
          {debts.length > 0 && (() => {
            const ava = calcPayoff(debts, 'avalanche', extra);
            const snow = calcPayoff(debts, 'snowball', extra);
            const surv = calcPayoff(debts, 'survival', 0);
            return (
              <div className="card" style={{ padding: 24, marginBottom: 14 }}>
                <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginBottom: 18 }}>ผลลัพธ์แต่ละกลยุทธ์</div>
                <div style={{ overflowX: 'auto' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                    <thead>
                      <tr style={{ borderBottom: '1px solid var(--border)' }}>
                        {['กลยุทธ์', 'ระยะเวลา', 'ดอกเบี้ยรวม', 'จ่ายรวม'].map(h => (
                          <th key={h} style={{ padding: '10px 14px', textAlign: 'left', fontSize: 10, fontWeight: 800, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {[
                        { label: 'Avalanche', data: ava, color: 'var(--indigo)', best: true },
                        { label: 'Snowball', data: snow, color: 'var(--emerald)', best: false },
                        { label: 'Minimum Only', data: surv, color: 'var(--text3)', best: false },
                      ].map((row, i) => (
                        <tr key={i} style={{ borderBottom: '1px solid var(--border)', background: row.best ? 'var(--indigo-dim2)' : 'transparent' }}>
                          <td style={{ padding: '14px 14px' }}>
                            <span style={{ fontWeight: 800, color: row.color }}>{row.label}</span>
                            {row.best && <span className="badge badge-indigo" style={{ marginLeft: 8 }}>ประหยัดสุด</span>}
                          </td>
                          <td className="mono" style={{ padding: '14px 14px', fontWeight: 700, color: 'var(--text)' }}>{row.data.months} เดือน</td>
                          <td className="mono" style={{ padding: '14px 14px', color: 'var(--rose)', fontWeight: 700 }}>฿{fmt(row.data.totalInterest)}</td>
                          <td className="mono" style={{ padding: '14px 14px', color: 'var(--text2)', fontWeight: 700 }}>฿{fmt(row.data.totalPaid)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          })()}

          {/* What-if scenarios */}
          <div className="card" style={{ padding: 24 }}>
            <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: '0.1em', textTransform: 'uppercase', color: 'var(--text3)', marginBottom: 18 }}>What-if Scenarios</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {[500, 1000, 2000, 5000].map(amt => {
                const res = calcPayoff(debts, 'avalanche', amt);
                const base = calcPayoff(debts, 'survival', 0);
                const saved = Math.max(0, base.totalInterest - res.totalInterest);
                const faster = Math.max(0, base.months - res.months);
                return (
                  <div key={amt} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '12px 16px', background: extra === amt ? 'var(--indigo-dim2)' : 'var(--bg3)', borderRadius: 12, border: `1px solid ${extra === amt ? 'rgba(108,99,255,0.25)' : 'var(--border)'}`, cursor: 'pointer', transition: 'all 0.2s' }}
                    onClick={() => setExtra(amt)}>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: 'var(--indigo)', minWidth: 70 }}>+฿{fmt(amt)}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, color: 'var(--text2)' }}>ปลดหนี้ใน <b style={{ color: 'var(--text)' }}>{res.months} เดือน</b> · เร็วขึ้น <b style={{ color: 'var(--amber)' }}>{faster} เดือน</b></div>
                      <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 2 }}>ประหยัดดอกเบี้ย ฿{fmt(saved)}</div>
                    </div>
                    {extra === amt && <div style={{ color: 'var(--indigo)' }}>{icons.check}</div>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('DebtMaster PWA ready ✓'))
      .catch(err => console.log('SW error:', err));
  });
}
</script>
</body>
</html>
